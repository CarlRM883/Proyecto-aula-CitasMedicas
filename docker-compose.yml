version: '3.8'

services:
  api:
    build: .
    command: uvicorn sistema_real.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./datos:/app/datos

  simulacion:
    build: .
    command: python simulacion/modelo_simpy.py
    volumes:
      - ./datos:/app/datos
    depends_on:
      - api